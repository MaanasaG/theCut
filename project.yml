name: TheCut
options:
  bundleIdPrefix: app.thecut
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en

packages:
  PomvoxSpeech:
    path: Packages/PomvoxSpeech
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    minVersion: "0.15.0"
    maxVersion: "0.15.6"

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  TheCut:
    type: application
    platform: iOS
    sources:
      - path: TheCut
        excludes:
          - "**/*.md"
    resources:
      - path: TheCut/Content/Packs
        type: folder
      - path: TheCut/Resources/Assets.xcassets
    dependencies:
      - package: PomvoxSpeech
      - package: FluidAudio
        product: FluidAudio
    info:
      path: TheCut/Info.plist
      properties:
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSMicrophoneUsageDescription: The Cut records your spoken interview answers on device for practice and Pomvox transcription. Audio never leaves your phone.
        NSSpeechRecognitionUsageDescription: Optional system speech fallback when Pomvox models are unavailable.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleDisplayName: The Cut
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.thecut.ios
        INFOPLIST_KEY_CFBundleDisplayName: The Cut
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_PREVIEWS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        DEAD_CODE_STRIPPING: YES
